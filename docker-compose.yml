# Local factory ledger (ADR 0003). Port 54329, not 5432, so it never clashes with another Postgres.
# Start it with `pnpm db:up`, then export
#   FACTORY_DATABASE_URL=postgres://factory:factory@localhost:54329/factory
services:
  ledger:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: factory
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ledger-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  ledger-data:
