# The proposal author (brief, section 4): turns an issue into proposal.md, delta specs and the
# x-complexity tag in .openspec.yaml. It never writes design.md or tasks.md.
name: proposal-author
model: claude-opus-5-5
tools: [Read, Grep, Glob, Edit, Write, WebFetch, Bash]
allow:
  - Read
  - Grep
  - Glob
  - Edit
  - Write
  # Any URL, no domain filter: owner decision of 2026-10-27 (add-role-runner design.md).
  - WebFetch
  # Read-only openspec only; the runner puts the factory's node_modules/.bin on PATH.
  - Bash(openspec validate:*)
  - Bash(openspec show:*)
  - Bash(openspec list:*)
  - Bash(openspec instructions:*)
# specs/*/spec.md, not specs/**/spec.md: a delta spec sits exactly one level down, at
# specs/<capability>/spec.md, and ** would also match specs/spec.md.
writable:
  - openspec/changes/{changeId}/proposal.md
  - openspec/changes/{changeId}/specs/*/spec.md
  - openspec/changes/{changeId}/.openspec.yaml
skills: []
maxTurns: 30
maxBudgetUsd: 3
resultSchema: proposal-result
authMode: subscription
