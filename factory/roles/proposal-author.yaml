# The proposal author (brief, section 4): turns an issue into proposal.md, delta specs and the
# x-complexity tag in .openspec.yaml. It never writes design.md or tasks.md.
# It has no Bash, locally or in the worker (owner decision of 2026-11-04, ADR 0007), so its prompt
# states the OpenSpec structure, taken from `openspec instructions` at the pinned version. An
# OpenSpec upgrade re-checks that text.
name: proposal-author
model: claude-opus-5-5
# No Bash, so it runs in the worker (ADR 0011).
runsIn: worker
tools: [Read, Grep, Glob, Edit, Write, WebFetch]
allow:
  - Read
  - Grep
  - Glob
  - Edit
  - Write
  # GitHub only: owner decision of 2026-10-27, changed 2026-11-02. Under dontAsk, any other host is denied.
  - WebFetch(domain:github.com)
  - WebFetch(domain:raw.githubusercontent.com)
# specs/*/spec.md, not specs/**/spec.md: a delta spec sits exactly one level down, at
# specs/<capability>/spec.md, and ** would also match specs/spec.md.
writable:
  - openspec/changes/{changeId}/proposal.md
  - openspec/changes/{changeId}/specs/*/spec.md
  - openspec/changes/{changeId}/.openspec.yaml
skills: []
maxTurns: 30
# Times the three Proposal attempts, within the $5 work-item limit.
maxBudgetUsd: 1.5
resultSchema: proposal-result
authMode: subscription
